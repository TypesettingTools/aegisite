{{ $pages := where .CurrentSection.RegularPages "Type" "not in" (slice "redirect" "glossary") -}}
{{ $next := $pages.Next . -}}
{{ $prev := $pages.Prev . -}}
{{ if or $next $prev -}}
	<div class="docs-navigation d-flex justify-content-between">
	<!-- https://www.feliciano.tech/blog/custom-sort-hugo-single-pages/ -->
	{{ with $next -}}
		<a href="{{ .RelPermalink }}">
			<div class="card my-1">
				<div class="card-body py-2">
					&larr; {{ .Title }}
				</div>
			</div>
		</a>
	{{ end -}}
	{{ with $prev -}}
		<a class="ms-auto" href="{{ .RelPermalink }}">
			<div class="card my-1">
				<div class="card-body py-2">
					{{ .Title }} &rarr;
				</div>
			</div>
		</a>
	{{ end -}}
	</div>
{{ end -}}
